# Walker2d-v5 PPO configuration.
# Walker2d-v5 is a 2D bipedal walker (torso + 2 legs, hip/knee/ankle each).
# Observation: 17-dim. Action: 6-dim in [-1, 1].
#
# This config matches CleanRL's benchmarked ppo_continuous_action.py recipe
# almost exactly. CleanRL reports Walker2d-v4: 2287.95 ± 571.78 (3 seeds, 2M
# steps, num_envs=1). We use num_envs=4 with proportionally smaller n_steps
# to keep the batch size identical (4 * 512 = 2048) but exploit GPU parallelism.

# -------- experiment identity --------
exp_name: "ppo_walker2d_v5"
env_id: "Walker2d-v5"
seed: 1
device: "auto"

# -------- vectorized rollout --------
num_envs: 4          # CleanRL uses 1; we use 4 for GPU wall-clock, batch stays the same
n_steps: 512         # 4 * 512 = 2048 = CleanRL's batch
total_timesteps: 2000000  # matches CleanRL benchmark exactly

# -------- optimization --------
learning_rate: 3.0e-4
anneal_lr: true
n_epochs: 10
minibatch_size: 64   # 2048 / 32 minibatches = 64
max_grad_norm: 0.5

# -------- PPO objective --------
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
clip_vloss: true
ent_coef: 0.0
vf_coef: 0.5
normalize_advantage: true
target_kl: null

# -------- env-side normalization --------
normalize_obs: true
normalize_reward: true
clip_obs: 10.0
clip_reward: 10.0

# -------- network (small MLP is enough for Walker2d) --------
hidden_sizes: [64, 64]
activation: "tanh"
log_std_init: 0.0

# -------- logging / checkpointing --------
log_dir: "logs"
ckpt_dir: "models"
video_dir: "videos"
save_every_iters: 25   # 2M / (4*512) = 976 iters → ~39 checkpoints
log_every_iters: 1
